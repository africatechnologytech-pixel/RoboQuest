<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RoboQuest</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17324d">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#17324d;--accent:#f59e0b;--accentbg:#fff3d6;--border:#dbe4ee;--muted:#64748b;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}
.app{max-width:760px;margin:auto;min-height:100vh;background:white}
header{background:var(--navy);color:#fff;padding:20px}
main{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--border);border-radius:18px;padding:18px;margin:12px 0;background:#fff}
button{min-height:46px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--navy);font-weight:700;padding:10px 14px;margin:4px;cursor:pointer}
.primary{background:var(--accentbg);border-color:var(--accent)}.muted{color:var(--muted)}
.stars{display:flex;flex-wrap:wrap}.star{font-size:25px;border:0;background:transparent}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;margin:6px 0 12px;font-size:16px}
img,video{max-width:100%;border-radius:12px;margin-top:10px}
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s}#splash video{width:100%;height:100%;object-fit:contain;margin:0;border-radius:0}#splash.hide{opacity:0;pointer-events:none}
header{background:#0f2a4a;padding:0}header .banner{display:block;width:100%;margin:0;border-radius:0}#greeting{padding:8px 16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#1d4ed8,#16a34a)}
main{padding-bottom:90px}
.welcome{background:linear-gradient(135deg,#eaf2ff,#e8fbe9);border:2px solid #bcd3f5;border-radius:20px;padding:16px;margin:12px 0}
.welcome h3{margin:0 0 6px}.welcome input{margin:6px 0}
.lvl{background:linear-gradient(135deg,#1d4ed8,#0f2a4a);color:#fff;border-radius:20px;padding:16px;margin:12px 0}
.lvl h3{margin:0 0 8px;font-size:20px}.bar{height:14px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}.bar i{display:block;height:100%;background:#84cc16;border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.tile{border-radius:18px;padding:14px;color:#0f2a4a}.tile b{display:block;font-size:26px}.tile span{font-size:13px;font-weight:700}
.t1{background:#fff3c4}.t2{background:#dff5d0}.t3{background:#dbeafe}.t4{background:#fde2e2}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.menu button{margin:0;min-height:74px;border-radius:18px;font-size:16px;border:2px solid #bcd3f5;background:#fff}
.menu .soon{opacity:.75}.menu small{display:block;font-weight:400;color:#64748b}
.teachbtn{width:100%;margin:4px 0 12px;background:#0f2a4a;color:#fff;min-height:54px;border-radius:16px}
#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;background:#0f2a4a;padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
#bottomnav button{flex:1;margin:0;border:0;background:transparent;color:#fff;font-size:12px;min-height:50px;border-radius:10px}#bottomnav button span{display:block;font-size:20px}

body{background:#f5f8fd}.app{background:#f5f8fd}main{padding:14px 14px 90px}
.card{border:1px solid #e3e0f4;border-radius:22px;padding:16px;margin:12px 0;background:#fff}
button{border:1px solid #d9e2f0;border-radius:14px}
.primary{background:#84cc16;border-color:#84cc16;color:#1a2e05}
.stars{gap:2px}.star{font-size:28px;min-height:44px;padding:4px 6px;margin:2px;background:#f3f1fd;border-radius:12px}
.welcome{background:#fff;border:1px solid #e3e0f4;border-radius:22px;padding:14px}
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}.wtop img{width:56px;height:56px;margin:0;border-radius:50%}.wtop small{color:#64748b;display:block}.wtop b{font-size:22px;color:#1d4ed8}
.wrow{display:flex;gap:8px}.wrow input{margin:0;flex:1}.wrow button{margin:0;min-width:84px}
.lvl{background:#eeecfb;color:#3c3489;border-radius:22px}.lvl small{display:block;color:#534ab7;margin:-4px 0 10px}
.bar{background:#cfcbf6}.bar i{background:#534ab7}
.tile{border-radius:20px;padding:14px}
.t1{background:#faebd7;color:#6b3a00}.t2{background:#e1f4ec;color:#0f5132}.t3{background:#e3effc;color:#0c447c}.t4{background:#eaf3de;color:#27500a}
.menu button{border:0}.menu .m1{background:#cfcbf6;color:#26215c}.menu .m2{background:#f5c4b3;color:#4a1b0c}.menu .m3{background:#d3d1c7;color:#2c2c2a}.menu .m4{background:#b5d4f4;color:#042c53}
.teachbtn{background:#17324d;border-radius:18px}
.hero{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px 14px;margin:10px 0}.hero img{width:100px;flex:none;margin:0;border-radius:0}.hero h2{margin:0 0 4px;font-size:21px}.hero p{margin:0;font-size:14px;color:#334155}
#pop{position:fixed;inset:0;z-index:9000;background:rgba(15,42,74,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.popbox{background:#fff;border-radius:26px;padding:20px;text-align:center;max-width:340px;width:100%;animation:pp .5s cubic-bezier(.2,1.6,.4,1)}.popbox img{width:190px;margin:0 auto 6px;display:block;border-radius:0}.popbox h2{margin:6px 0}.popbox p{color:#475569;margin:0 0 12px}
@keyframes pp{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.lthumb{width:48px;height:48px;border-radius:12px;background:#e9e6fb;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none}.lthumb img{width:100%;height:100%;object-fit:cover;margin:0;border-radius:0}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}.lhead h3{margin:0}
.lrow{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.lrow .lthumb{width:64px;height:64px;font-size:30px}.lrow input[type=text]{margin:0 0 6px}
.filebtn{display:inline-block;min-height:40px;line-height:40px;padding:0 12px;border:1px solid #d9e2f0;border-radius:12px;background:#f3f1fd;font-weight:700;font-size:14px;cursor:pointer}.filebtn input{display:none}
.lrow button{min-height:40px;margin:0 0 0 6px;padding:0 12px;font-size:14px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="splash" onclick="hideSplash()"><video id="splashvid" src="776932576_1791062217115790.mp4" autoplay muted playsinline></video></div>
<div class="app">
<header><img class="banner" src="rq-banner.jpg" alt="RoboQuest"><div id="greeting"></div></header>
<main id="screen"></main>
<div id="bottomnav"><button onclick="home()"><span>🏠</span>Home</button><button onclick="progress()"><span>🏆</span>Progress</button><button onclick="electronics()"><span>⚡</span>Electronics</button><button onclick="teacher()"><span>⚙️</span>Teacher</button></div>
</div>
<script>
const KEY="roboquest_v1";
const defaults={
 child:"Inventor",
 stars:Array.from({length:5},()=>Array.from({length:4},()=>[false,false,false,false,false])),
 stats:{answered:0,correct:0},
 rankNames:Array.from({length:5},()=>["Robo Rookie","Robo Junior Inventor","Robo Builder","Robo Master"]),
 rankImgs:Array.from({length:5},()=>["","","",""]),
 components:{
  Power:[{name:"Battery",what:"A battery is a source of electrical energy.",does:"It supplies electrical power to a circuit.",image:"",video:""}],
  Input:[{name:"Push Button",what:"A push button is an input component operated by pressing it.",does:"It lets a user send an ON/OFF signal to a circuit or controller.",image:"",video:""}],
  Control:[{name:"Arduino",what:"Arduino is a programmable electronics platform.",does:"It can read inputs and control outputs.",image:"",video:""}],
  Output:[{name:"Motor",what:"A motor converts electrical energy into mechanical motion.",does:"It produces rotational movement.",image:"",video:""}],
  Support:[{name:"Resistor",what:"A resistor is an electronic component that resists current.",does:"It helps control current in a circuit.",image:"",video:""}]
 },
 quizzes:[{q:"Which one is an electronic component?",a:["Gear","Battery","Wheel","Lever"],correct:1}]
};
let state=load();
const ranks=["Robo Rookie","Robo Junior Inventor","Robo Builder","Robo Master"];
const cats=["Power","Input","Control","Output","Support"];
const icons={Power:"🔋",Input:"🔘",Control:"🧠",Output:"⚙️",Support:"〰️"};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(!x)return clone(defaults);const s=Object.assign(clone(defaults),x);if(!Array.isArray(s.stars[0][0]))s.stars=[s.stars].concat(clone(defaults.stars).slice(1));if(!s.stats)s.stats={answered:0,correct:0};return s}catch(e){return clone(defaults)}}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function lname(l){return `Level ${l+1}`}
function rname(l,r){const n=state.rankNames&&state.rankNames[l]&&state.rankNames[l][r];return (n&&n.trim())||ranks[r]}
function rthumb(l,r,px){const u=state.rankImgs&&state.rankImgs[l]&&state.rankImgs[l][r];return `<div class="lthumb"${px?` style="width:${px}px;height:${px}px;font-size:${Math.round(px/2)}px"`:""}>${u?`<img src="${u}" alt="">`:"🏅"}</div>`}
function levelDone(l){return state.stars[l].flat().every(Boolean)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert("Could not save. Storage may be full.")}}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("roboquest_media",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putFile(file){if(!file)return"";const db=await openDB();const id="f"+Date.now()+Math.random().toString(36).slice(2);await new Promise((res,rej)=>{const t=db.transaction("files","readwrite");t.objectStore("files").put(file,id);t.oncomplete=res;t.onerror=()=>rej(t.error)});return id}
async function fileUrl(id){if(!id)return"";try{const db=await openDB();return await new Promise(res=>{const q=db.transaction("files").objectStore("files").get(id);q.onsuccess=()=>res(q.result?URL.createObjectURL(q.result):"");q.onerror=()=>res("")})}catch(e){return""}}
function el(s){return document.getElementById(s)}
function nav(){return `<button onclick="home()">← Home</button>`}
function hero(img,title,sub,bg){return `<div class="hero" style="background:${bg}"><img src="av-${img}.png" alt=""><div><h2>${title}</h2><p>${sub}</p></div></div>`}
const CLAP="av-thumbs.png";
function celebrate(title,msg){const d=document.createElement("div");d.id="pop";d.innerHTML=`<div class="popbox"><img src="${CLAP}" alt=""><div style="font-size:26px">🎉⭐🎉</div><h2>${esc(title)}</h2><p>${esc(msg)}</p><button class="primary" onclick="this.closest('#pop').remove()">Awesome!</button></div>`;document.body.appendChild(d)}
function home(){const stars=state.stars.flat(2).filter(Boolean).length;let lvl=1;while(lvl<5&&levelDone(lvl-1))lvl++;const facts=cats.reduce((n,c)=>n+state.components[c].length,0);const lstars=state.stars[lvl-1].flat().filter(Boolean).length;el("greeting").textContent=`Welcome, ${state.child}!`;el("screen").innerHTML=`<div class="welcome"><div class="wtop"><img src="icon-192.png" alt=""><div><small>Welcome</small><b>Future Inventor!</b></div></div><div class="wrow"><input id="childname" value="${esc(state.child)}" placeholder="Enter your name"><button class="primary" onclick="saveName()">Save</button></div></div><div class="lvl"><h3>🏆 ${esc(lname(lvl-1))}</h3><small>Current level</small><div class="bar"><i style="width:${lstars*5}%"></i></div><p style="margin:8px 0 0">${lvl<5?`${lstars} of 20 RoboStars to ${esc(lname(lvl))}`:`${lstars} of 20 RoboStars in the last level`}</p></div><div class="tiles"><div class="tile t1"><b>⭐ ${stars}/100</b><span>RoboStars earned</span></div><div class="tile t2"><b>💡 ${facts}</b><span>Facts learned</span></div><div class="tile t3"><b>❓ ${state.quizzes.length}</b><span>Quiz questions</span></div><div class="tile t4"><b>✅ ${state.stats.correct}/${state.stats.answered}</b><span>Quiz answers correct</span></div></div><div class="menu"><button class="m1" onclick="progress()">🏆 Progress</button><button class="m2" onclick="electronics()">⚡ Electronics</button><button class="m3" onclick="mechanical()">⚙️ Mechanical<small>Coming soon</small></button><button class="m4" onclick="about()">📖 About</button></div><button class="teachbtn" onclick="teacher()">🔒 Teacher control</button>`}
function saveName(){state.child=el("childname").value.trim()||"Inventor";save();home()}
function progress(){let h=nav()+hero('ladder','🏆 Progress','Complete all 20 RoboStars in a level to unlock the next level.','#eeecfb');for(let l=0;l<5;l++){const unlocked=l===0||levelDone(l-1);h+=`<div class="card"><h3>${esc(lname(l))} ${unlocked?"🔓":"🔒"}</h3>`;if(unlocked){ranks.forEach((r,ri)=>{h+=`<div class="lhead" style="margin-top:8px">${rthumb(l,ri,36)}<b>${esc(rname(l,ri))}</b></div><div class="stars">`;state.stars[l][ri].forEach((on,si)=>h+=`<button class="star" onclick="award(${l},${ri},${si})">${on?"⭐":"☆"}</button>`);h+=`</div>`});h+=`<p class="muted">${state.stars[l].flat().filter(Boolean).length}/20 RoboStars</p>`}else h+=`<p class="muted">Locked — complete the previous level.</p>`;h+=`</div>`}el("screen").innerHTML=h}
function award(l,r,s){const row=state.stars[l][r];if(row[s]){const later=row.slice(s+1).filter(Boolean).length;if(later&&!confirm(`Remove this star and the ${later} star(s) after it?`))return;for(let k=s;k<row.length;k++)row[k]=false;save();progress();return}if(row.slice(0,s).every(Boolean)){row[s]=true;save();progress();if(levelDone(l)){celebrate(`${lname(l)} complete!`,l<4?`${lname(l+1)} is unlocked.`:"All levels complete! Amazing!")}return}progress()}
function electronics(){el("screen").innerHTML=nav()+hero('solder','⚡ Electronics','Choose a category to explore.','#fbe3da')+`<div class="grid">${cats.map(c=>`<button onclick="category('${c}')">${icons[c]} ${c}</button>`).join("")}</div><div class="card"><button onclick="quiz()">❓ Quiz</button><button onclick="simulation()">🔌 Simulation</button><button onclick="battle()">⚔️ Battle Mode</button></div>`}
function category(c){el("screen").innerHTML=nav()+`<button onclick="electronics()">← Electronics</button><h2>${icons[c]} ${c}</h2><div class="grid">${state.components[c].map((x,i)=>`<button onclick="component('${c}',${i})">${x.name}</button>`).join("")}</div>`}
function component(c,i){const x=state.components[c][i];el("screen").innerHTML=nav()+`<button onclick="category('${c}')">← ${c}</button><div class="card"><h2>${x.name}</h2><h3>What is it?</h3><p>${x.what||"No description added yet."}</p><h3>What does it do?</h3><p>${x.does||"No function description added yet."}</p>${(x.image||x.imageId)?`<img id="mimg" src="${x.image||""}" alt="${x.name}">`:""}${(x.video||x.videoId)?`<video id="mvid" controls src="${x.video||""}"></video>`:""}</div>`;if(x.imageId)fileUrl(x.imageId).then(u=>{if(u&&el("mimg"))el("mimg").src=u});if(x.videoId)fileUrl(x.videoId).then(u=>{if(u&&el("mvid"))el("mvid").src=u})}
function mechanical(){el("screen").innerHTML=nav()+`${hero('gears','⚙️ Mechanical World','Coming soon! It will be added in a future version.','#e8e6df')}`}
function about(){el("screen").innerHTML=nav()+`${hero('car','📖 About RoboQuest','An interactive robotics learning journey for young inventors.','#dbeafe')}`}
function teacher(){el("screen").innerHTML=nav()+`${hero('gearhold','🔒 Teacher control','Add components, quizzes and rank names.','#dff5d0')}<div class="card"><h3>Rank names and pictures</h3><select id="tl" onchange="changeTLevel(this.value)">${[0,1,2,3,4].map(i=>`<option value="${i}"${i===tLevel?" selected":""}>Level ${i+1}</option>`).join("")}</select>${[0,1,2,3].map(r=>`<div class="lrow">${rthumb(tLevel,r)}<div style="flex:1;min-width:0"><input type="text" id="rn${r}" value="${esc(rname(tLevel,r))}" placeholder="Rank ${r+1} name"><label class="filebtn">${state.rankImgs[tLevel][r]?"Change picture":"Choose picture"}<input type="file" accept="image/*" onchange="setRankImg(${r},this)"></label>${state.rankImgs[tLevel][r]?`<button onclick="clearRankImg(${r})">Remove</button>`:""}</div></div>`).join("")}<button class="primary" onclick="saveRanks()">Save rank names</button></div><div class="card"><h3>Add Component</h3><select id="cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select><input id="name" placeholder="Component name"><textarea id="what" placeholder="What is it?"></textarea><textarea id="does" placeholder="What does it do?"></textarea><label>Picture<input id="image" type="file" accept="image/*"></label><label>Video<input id="video" type="file" accept="video/*"></label><button class="primary" onclick="addComponent()">Add Component</button></div><div class="card"><h3>Quiz Manager</h3><p>${state.quizzes.length} quiz question(s)</p>${state.quizzes.map((q,qi)=>`<p>${qi+1}. ${esc(q.q)} <button onclick="removeQuiz(${qi})">🗑️</button></p>`).join("")}<h3>Add Quiz Question</h3><input id="qq" placeholder="Question"><input id="qa0" placeholder="Answer A"><input id="qa1" placeholder="Answer B"><input id="qa2" placeholder="Answer C"><input id="qa3" placeholder="Answer D"><select id="qc"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><button class="primary" onclick="addQuiz()">➕ Add Quiz</button></div><div class="card"><h3>Components</h3>${cats.map(c=>`<p><b>${icons[c]} ${c}</b></p>${state.components[c].map((x,i)=>`<p>${esc(x.name)} <button onclick="removeComponent('${c}',${i})">🗑️</button></p>`).join("")||`<p class="muted">None</p>`}`).join("")}</div>`}
function fileData(file){return new Promise(resolve=>{if(!file)return resolve("");const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}
async function addComponent(){const name=el("name").value.trim();if(!name)return alert("Enter a component name.");const c=el("cat").value;state.components[c].push({name,what:el("what").value.trim(),does:el("does").value.trim(),image:"",video:"",imageId:await putFile(el("image").files[0]),videoId:await putFile(el("video").files[0])});save();teacher()}
async function delFile(id){if(!id)return;try{const db=await openDB();db.transaction("files","readwrite").objectStore("files").delete(id)}catch(e){}}
async function removeComponent(c,i){const x=state.components[c][i];if(!confirm(`Delete "${x.name}"?`))return;await delFile(x.imageId);await delFile(x.videoId);state.components[c].splice(i,1);save();teacher()}
function addQuiz(){const q=el("qq").value.trim(),a=[0,1,2,3].map(i=>el("qa"+i).value.trim());if(!q||a.some(x=>!x))return alert("Enter the question and all four answers.");state.quizzes.push({q,a,correct:+el("qc").value});save();teacher()}
function removeQuiz(i){if(confirm("Remove this question?")){state.quizzes.splice(i,1);save();teacher()}}
let qi=0;
function quiz(){if(!state.quizzes.length){el("screen").innerHTML=nav()+`<div class="card"><h2>❓ Quiz</h2><p>No questions yet. Ask the teacher to add some.</p></div>`;return}qi=Math.floor(Math.random()*state.quizzes.length);const q=state.quizzes[qi];el("screen").innerHTML=nav()+`<button onclick="electronics()">← Electronics</button>${hero('think','❓ Quiz','Pick the right answer.','#dbeafe')}<div class="card"><h3>${esc(q.q)}</h3>${q.a.map((a,i)=>`<button style="display:block;width:100%" onclick="answer(${i})">${esc(a)}</button>`).join("")}</div>`}
function answer(i){const q=state.quizzes[qi];const ok=i===q.correct;state.stats.answered++;if(ok)state.stats.correct++;save();el("screen").innerHTML=nav()+`${hero(ok?'thumbs':'fire',ok?'✅ Correct!':'❌ Not quite',ok?'Great job, inventor!':'Check the answer and try again.',ok?'#dff5d0':'#fde2e2')}<div class="card">${ok?"":`<p>Correct answer: ${esc(q.a[q.correct])}</p>`}<button class="primary" onclick="quiz()">Next question</button></div>`}
function simulation(){el("screen").innerHTML=nav()+`<div class="card"><h2>🔌 Simulation</h2><p>Simulation is kept aside for now. We will expand it later.</p></div>`}
function battle(){el("screen").innerHTML=nav()+`<div class="card"><h2>⚔️ Battle Mode</h2><p>Battle Mode is kept aside for now. We will expand it later.</p></div>`}
home();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");


let tLevel=0;
function readRanks(){state.rankNames[tLevel]=[0,1,2,3].map(r=>el("rn"+r)?el("rn"+r).value.trim()||ranks[r]:rname(tLevel,r))}
function changeTLevel(v){readRanks();save();tLevel=+v;teacher()}
function setRankImg(r,inp){const f=inp.files&&inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d");const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);readRanks();state.rankImgs[tLevel][r]=c.toDataURL("image/jpeg",.82);save();teacher()};im.onerror=()=>alert("That picture could not be opened.");im.src=fr.result};fr.readAsDataURL(f)}
function clearRankImg(r){readRanks();state.rankImgs[tLevel][r]="";save();teacher()}
function saveRanks(){readRanks();save();alert("Rank names saved!")}
function hideSplash(){const d=el("splash");if(d&&!d.classList.contains("hide")){d.classList.add("hide");setTimeout(()=>d.remove(),600)}}
(function(){const v=el("splashvid");v.onended=hideSplash;v.onerror=hideSplash;setTimeout(hideSplash,10000);const p=v.play();if(p&&p.catch)p.catch(hideSplash)})();
</script>
</body>
</html>
