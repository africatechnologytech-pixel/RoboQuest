   So a motor and an LED wired to the same button move together ("Motor 1 / LED 1"), and parts wired to

 mot.forEach((id,k)=>mn[id]="Motor "+(k+1));led.forEach((id,k)=>ln[id]="LED "+(k+1));

 btn.forEach((b,bi)=>{const ms=mot.filter(id=>rdRun(rb[b],id)&&!rdRun(r0,id)),ls=led.filter(id=>rdLit(rb[b],id)&&!rdLit(r0,id));

function smallServo(o){const a=o.ang===undefined?90:o.ang;return `<div class="card" style="margin:0"><div style="margin:4px 0">🦾 Servo angle: <b id="svv">${a}</b>° <span class="muted">— use the bar on the left</span></div><button onclick="mLayer()">Layer: ${o.z===1?"In front":"Behind"} (tap to switch)</button><div class="muted">${{S:"Micro",M:"Standard",L:"High-torque"}[o.sz||"M"]} servo · ${SVT[o.sz||"M"]} kg·cm</div></div>`}

function cmdState(){const o=sim.p&&sim.p.parts&&sim.p.parts.find(q=>q.id===sim.sel),t=o&&o.t,idle=!sim.run,on=(id,v)=>{const b=el(id);if(b){b.disabled=!v;b.style.opacity=v?1:.4}};on("cRot",idle&&!!o&&["frame","rack","bevel","worm","motor","shaft","drum","brick","arm","pincher"].includes(t));on("cDisc",idle&&!!o&&t!=="belt"&&t!=="rack");on("cDel",idle&&!!o);on("cLay",!!o&&((idle&&(t==="gear"||t==="arm"))||t==="servo"));on("cSwap",idle&&t==="dgear")}

function mGroupFam(id){const F=["arm","servo","pincher"],seen=new Set([id]),st=[id],by=i=>sim.p.parts.find(q=>q.id===i);while(st.length){const c=st.pop();sim.p.bonds.forEach(b=>{const n=b[0]===c?b[1]:b[1]===c?b[0]:null;if(n&&!seen.has(n)){const q=by(n);if(q&&F.includes(q.t)){seen.add(n);st.push(n)}}})}return sim.p.parts.filter(o=>seen.has(o.id))}
function pruneBonds(){const P=sim.p.parts,FX=["arm","pincher"],FM=["arm","servo","pincher"],FB=["arm","servo","pincher","brick"];sim.p.bonds=sim.p.bonds.filter(b=>{const A=P.find(q=>q.id===b[0]),B=P.find(q=>q.id===b[1]);if(!A||!B)return false;if((FX.includes(A.t)&&!FM.includes(B.t))||(FX.includes(B.t)&&!FM.includes(A.t)))return false;if(FB.includes(A.t)&&FB.includes(B.t))return touches(A,B);if((A.t==="servo"&&B.t==="frame")||(B.t==="servo"&&A.t==="frame"))return touches(A,B);return true})}

{const _mRot0=mRot;mRot=function(){const o=sim.p.parts.find(q=>q.id===sim.sel);_mRot0();if(o&&(o.t==="arm"||o.t==="pincher")){sim._excl=null;autoSnap(o);bondContacts(o,[o.id]);save();drawM()}}}

function headW(aid,i,j){const svg=el("sv");if(!svg||!svg.getScreenCTM||!svg.querySelector)return null;try{const n=svg.querySelector('.hd[data-a="'+aid+'"][data-hi="'+i+'"][data-hj="'+j+'"]');if(!n)return null;const m=svg.getScreenCTM().inverse().multiply(n.getScreenCTM()),cx=+n.getAttribute("cx")||0,cy=+n.getAttribute("cy")||0,x=(m.a*cx+m.c*cy+m.e)/LP,y=(m.b*cx+m.d*cy+m.f)/LP;return isFinite(x)&&isFinite(y)?[x,y]:null}catch(e){return null}}
function armHW(a){const u=UV2[(a.rot||0)%4],ti=a.i+u[0]*a.len,tj=a.j+u[1]*a.len;return{p:headW(a.id,a.i,a.j)||[a.i,a.j],t:headW(a.id,ti,tj)||[ti,tj]}}

const SVS={S:.55,M:.72,L:.9},SVT={S:1.5,M:4,L:10};
function setSz(v){const o=sim.p.parts.find(q=>q.id===sim.sel);if(!o)return;o.sz=v;save();if(sim.p.type==="m")drawM(true);else drawSim(true)}
function potPiece(x,y,pos){const p=pos===undefined?50:pos,a=(p/100*270-135)*Math.PI/180;let t="";for(let k=0;k<12;k++){const b=k*Math.PI/6;t+=`<line x1="${(x+Math.sin(b)*7).toFixed(1)}" y1="${(y-Math.cos(b)*7).toFixed(1)}" x2="${(x+Math.sin(b)*9.4).toFixed(1)}" y2="${(y-Math.cos(b)*9.4).toFixed(1)}" stroke="#475569" stroke-width="1"/>`}return `<g pointer-events="none"><rect x="${x-13}" y="${y-13}" width="26" height="26" rx="5" fill="#1e3a8a" stroke="#0f172a" stroke-width="1.5"/><rect x="${x-9}" y="${y+12}" width="3.5" height="5" fill="#d4d4d8"/><rect x="${x-1.7}" y="${y+12}" width="3.5" height="5" fill="#d4d4d8"/><rect x="${x+5.5}" y="${y+12}" width="3.5" height="5" fill="#d4d4d8"/><circle cx="${x}" cy="${y}" r="10" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/><circle cx="${x}" cy="${y}" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>${t}<line x1="${x}" y1="${y}" x2="${(x+Math.sin(a)*8).toFixed(1)}" y2="${(y-Math.cos(a)*8).toFixed(1)}" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/></g>`}
SIMPIC.pot='<svg width="48" height="32" viewBox="0 0 48 32">'+potPiece(24,15,60)+'</svg>';
