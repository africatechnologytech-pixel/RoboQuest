async function putFile(file){if(!file)return"";const db=await openDB();const id="f"+Date.now()+Math.random().toString(36).slice(2);await new Promise((res,rej)=>{const t=db.transaction("files","readwrite");t.objectStore("files").put(file,id);t.oncomplete=res;t.onerror=()=>rej(t.error)});return id}
async function fileUrl(id){if(!id)return"";try{const db=await openDB();return await new Promise(res=>{const q=db.transaction("files").objectStore("files").get(id);q.onsuccess=()=>res(q.result?URL.createObjectURL(q.result):"");q.onerror=()=>res("")})}catch(e){return""}}
function el(s){return document.getElementById(s)}
function nav(){el("screen").classList.remove("dk");return `<button onclick="home()">← Home</button>`}
function hero(img,title,sub,bg){return `<div class="hero" style="background:${bg}"><img src="av-${img}.png" alt=""><div><h2>${title}</h2><p>${sub}</p></div></div>`}
const CLAP="av-thumbs.png";
function celebrate(title,msg){const d=document.createElement("div");d.id="pop";d.innerHTML=`<div class="popbox"><img src="${CLAP}" alt=""><div style="font-size:26px">🎉⭐🎉</div><h2>${esc(title)}</h2><p>${esc(msg)}</p><button class="primary" onclick="this.closest('#pop').remove()">Awesome!</button></div>`;document.body.appendChild(d)}
function pagesOf(x){if(!x.pages)x.pages=[{what:x.what||"",does:x.does||"",image:x.image||"",video:x.video||"",imageId:x.imageId||"",videoId:x.videoId||""}];if(x.done===undefined)x.done=false;return x.pages}

function home(){el("screen").classList.remove("dk");const stars=state.stars.flat(2).filter(Boolean).length;let lvl=1;while(lvl<5&&levelDone(lvl-1))lvl++;const facts=["e","m"].reduce((n,w)=>n+WORLD[w].cats.reduce((k,c)=>k+(comps(w)[c]||[]).filter(x=>{pagesOf(x);return x.done}).length,0),0);const lstars=state.stars[lvl-1].flat().filter(Boolean).length;el("greeting").textContent=`Welcome, ${state.child}!`;el("screen").innerHTML=`<div class="welcome"><div class="wtop"><img src="icon-192.png" alt=""><div><small>Welcome</small><b>Future Inventor!</b></div></div><div class="wrow"><input id="childname" value="${esc(state.child)}" placeholder="Enter your name"><button class="primary" onclick="saveName()">Save</button></div></div><div class="lvl"><h3>🏆 ${esc(lname(lvl-1))}</h3><small>Current level</small><div class="bar"><i style="width:${lstars*5}%"></i></div><p style="margin:8px 0 0">${lvl<5?`${lstars} of 20 RoboStars to ${esc(lname(lvl))}`:`${lstars} of 20 RoboStars in the last level`}</p></div><div class="tiles"><div class="tile t1"><b>⭐ ${stars}/100</b><span>RoboStars earned</span></div><div class="tile t2"><b>💡 ${facts}</b><span>Facts learned</span></div><div class="tile t3"><b>❓ ${state.quizzes.length+state.mquizzes.length}</b><span>Quiz questions</span></div><div class="tile t4"><b>✅ ${state.stats.correct}/${state.stats.answered}</b><span>Quiz answers correct</span></div></div><div class="tile t5 wide"><b>⚔️ ${state.stats.wins||0}</b><span>Battles won</span></div><div class="menu"><button class="m1" onclick="progress()">🏆 Progress</button><button class="m2" onclick="electronics()">⚡ Electronics</button><button class="m3" onclick="mechanical()">⚙️ Mechanical</button><button class="m4" onclick="about()">📖 About</button></div><button class="teachbtn" onclick="openTeacher()">🔒 Teacher control</button>`}

function progress(){let h=nav()+hero('ladder','🏆 Progress','Complete all 20 RoboStars in a level to unlock the next level.','#eeecfb');for(let l=0;l<5;l++){const unlocked=l===0||levelDone(l-1);h+=`<div class="card"><h3>${esc(lname(l))} ${unlocked?"🔓":"🔒"}</h3>`;if(unlocked){ranks.forEach((r,ri)=>{h+=`<div class="lhead" style="margin-top:8px">${rthumb(l,ri,36)}<b>${esc(rname(l,ri))}</b></div><div class="stars">`;state.stars[l][ri].forEach((on,si)=>h+=`<button class="star" onclick="award(${l},${ri},${si})">${on?"⭐":"☆"}</button>`);h+=`</div>`});h+=`<p class="muted">${state.stars[l].flat().filter(Boolean).length}/20 RoboStars</p>`}else h+=`<p class="muted">Locked — complete the previous level.</p>`;h+=`</div>`}el("screen").innerHTML=h}
function award(l,r,s){const row=state.stars[l][r];if(row[s]){const later=row.slice(s+1).filter(Boolean).length;if(later&&!confirm(`Remove this star and the ${later} star(s) after it?`))return;for(let k=s;k<row.length;k++)row[k]=false;save();progress();return}if(row.slice(0,s).every(Boolean)){row[s]=true;save();progress();if(levelDone(l)){celebrate(`${lname(l)} complete!`,l<4?`${lname(l+1)} is unlocked.`:"All levels complete! Amazing!")}return}progress()}

function worldHome(w){const W=WORLD[w],C=comps(w),isE=w==="e";el("screen").innerHTML=nav()+hero(W.hero,`${W.icon} ${W.name}`,"Tap a branch to explore.",W.tint)+`<div class="troot">${W.icon} ${W.name}</div><div class="tree">${W.cats.map((c,k)=>{const L=C[c]||[],o=!!treeOpen[w+c];return `<div class="tbr"><button class="tnode" style="background:${PAST[k%5]}" onclick="toggleBranch('${w}','${c}')"><span>${W.icons[c]} <b>${esc(c)}</b>${W.sub[c]?`<small>${esc(W.sub[c])}</small>`:""}</span><em>${L.length} ${o?"▾":"▸"}</em></button>${o?`<div class="tleaves">${L.length?L.map((x,i)=>{pagesOf(x);return `<button class="tleaf" onclick="component('${c}',${i},0,'${w}')">${x.done?"✅ ":"🔹 "}${esc(x.name)}</button>`}).join(""):'<p class="muted" style="margin:6px 0">Nothing here yet.</p>'}</div>`:""}</div>`}).join("")}</div><div class="card"><button onclick="quiz('${w}')">❓ Quiz</button><button onclick="${isE?"simulation()":"msim()"}">🔌 Simulation</button>${isE?`<button onclick="battle()">⚔️ Battle Mode</button>`:`<button class="bpic" onclick="mbattle()"><img src="${BT.bandana}" alt=""><span>⚔️ Battle Mode</span></button>`}</div>`}

function category(c){el("screen").innerHTML=nav()+`<button onclick="electronics()">← Electronics</button><h2>${icons[c]} ${c}</h2><div class="grid">${state.components[c].map((x,i)=>{pagesOf(x);return `<button onclick="component('${c}',${i})">${x.done?"✅ ":""}${esc(x.name)}</button>`}).join("")}</div>`}
function component(c,i,p=0,w="e"){const x=comps(w)[c][i];const pg=pagesOf(x);p=Math.max(0,Math.min(p,pg.length-1));const g=pg[p];treeOpen[w+c]=true;el("screen").innerHTML=nav()+`<button onclick="worldHome('${w}')">← ${esc(WORLD[w].name)}</button><div class="card"><h2>${x.done?"✅ ":""}${esc(x.name)}</h2><p class="muted">${WORLD[w].icons[c]} ${esc(c)} · Page ${p+1} of ${pg.length}</p><h3>What is it?</h3><p>${esc(g.what)||"No description added yet."}</p><h3>What does it do?</h3><p>${esc(g.does)||"No function description added yet."}</p>${(g.image||g.imageId)?`<img id="mimg" src="${g.image||""}" alt="">`:""}${(g.video||g.videoId)?`<video id="mvid" controls src="${g.video||""}"></video>`:""}${pg.length>1?`<div class="pager"><button ${p===0?"disabled":""} onclick="component('${c}',${i},${p-1},'${w}')">← Back</button><button class="primary" ${p===pg.length-1?"disabled":""} onclick="component('${c}',${i},${p+1},'${w}')">Next page →</button></div>`:""}</div>`;if(g.imageId)fileUrl(g.imageId).then(u=>{if(u&&el("mimg"))el("mimg").src=u});if(g.videoId)fileUrl(g.videoId).then(u=>{if(u&&el("mvid"))el("mvid").src=u})}

function ranksCard(){return `<div class="card"><h3>Rank names and pictures</h3><select id="tl" onchange="changeTLevel(this.value)">${[0,1,2,3,4].map(i=>`<option value="${i}"${i===tLevel?" selected":""}>Level ${i+1}</option>`).join("")}</select>${[0,1,2,3].map(r=>`<div class="lrow">${rthumb(tLevel,r)}<div style="flex:1;min-width:0"><input type="text" id="rn${r}" value="${esc(rname(tLevel,r))}" placeholder="Rank ${r+1} name"><label class="filebtn">${state.rankImgs[tLevel][r]?"Change picture":"Choose picture"}<input type="file" accept="image/*" onchange="setRankImg(${r},this)"></label>${state.rankImgs[tLevel][r]?`<button onclick="clearRankImg(${r})">Remove</button>`:""}</div></div>`).join("")}<button class="primary" onclick="saveRanks()">Save rank names</button></div>`}
function addCard(w){return `<div class="card"><h3>Add ${WORLD[w].name} component</h3><select id="cat" onchange="draft.cat=this.value">${WORLD[w].cats.map(c=>`<option${c===draft.cat?" selected":""}>${esc(c)}</option>`).join("")}</select><input id="name" value="${esc(draft.name)}" oninput="draft.name=this.value" placeholder="Component name"><p class="muted" style="margin:6px 0"><b>Page ${draft.pages.length+1}</b>${draft.pages.length?` (${draft.pages.length} page${draft.pages.length>1?"s":""} saved so far)`:""}</p><textarea id="what" placeholder="What is it?"></textarea><textarea id="does" placeholder="What does it do?"></textarea><label>Picture<input id="image" type="file" accept="image/*"></label><label>Video<input id="video" type="file" accept="video/*"></label><button onclick="nextPage()">➕ Next page</button><button class="primary" onclick="addComponent()">Save component</button>${draft.pages.length||draft.name?`<button onclick="clearDraft()">Start over</button>`:""}</div>`}
function compCard(w){return `<div class="card"><h3>${WORLD[w].icon} ${WORLD[w].name} components</h3>${WORLD[w].cats.map(c=>`<p><b>${WORLD[w].icons[c]} ${esc(c)}</b></p>${comps(w)[c].map((x,i)=>`<p class="crow"><span>${esc(x.name)} <small class="muted">(${pagesOf(x).length} page${pagesOf(x).length>1?"s":""})</small></span><button onclick="editComponent('${w}','${c}',${i})">✏️</button><button class="${x.done?"primary":""}" onclick="toggleDone('${c}',${i},'${w}')">${x.done?"✅ Done":"☐ Done"}</button><button onclick="removeComponent('${c}',${i},'${w}')">🗑️</button></p>`).join("")||`<p class="muted">None</p>`}`).join("")}</div>`}
function quizCard(w){const Q=state[WORLD[w].qk];return `<div class="card"><h3>${WORLD[w].icon} ${WORLD[w].name} quiz</h3><p>${Q.length} question(s)</p>${Q.map((q,qi)=>`<p class="crow"><span>${qi+1}. ${esc(q.q)}</span><button onclick="removeQuiz(${qi},'${w}')">🗑️</button></p>`).join("")}<h3>Add Quiz Question</h3><input id="qq" placeholder="Question"><input id="qa0" placeholder="Answer A"><input id="qa1" placeholder="Answer B"><input id="qa2" placeholder="Answer C"><input id="qa3" placeholder="Answer D"><select id="qc"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><button class="primary" onclick="addQuiz()">➕ Add Quiz</button></div>`}
function tMenu(){const n=w=>WORLD[w].cats.reduce((k,c)=>k+comps(w)[c].length,0);const blk=(k,ic,t,sub,col)=>`<button class="tblk" style="background:${col}" onclick="openSec('${k}')"><span>${ic}</span><b>${t}</b>${sub?`<small>${sub}</small>`:""}</button>`;return `<h3 class="tsec">🏅 Levels</h3><div class="tblks">${blk("ranks","🏅","Rank names & pictures","","#eeecfb")}</div><h3 class="tsec">⚡ Electronics</h3><div class="tblks">${blk("addE","➕","Add component","","#fbe3da")}${blk("compE","📚","Components",n("e")+" saved","#dff5d0")}${blk("quizE","❓","Quiz questions",state.quizzes.length+" saved","#e3effc")}</div><h3 class="tsec">⚙️ Mechanical World</h3><div class="tblks">${blk("addM","➕","Add component","","#fbe3da")}${blk("compM","📚","Components",n("m")+" saved","#dff5d0")}${blk("quizM","❓","Quiz questions",state.mquizzes.length+" saved","#e3effc")}</div><h3 class="tsec">⚔️ Battle</h3><div class="tblks">${blk("arena","⚔️","Battle arena","Box, distance, time","#fde2e2")}</div>`}
function teacher(){const t=tSec,w=t&&t.endsWith("M")?"m":"e";let body;if(!t)body=hero('gearhold','🔒 Teacher control','Tap a block to open it.','#dff5d0')+tMenu();else{const title={ranks:"🏅 Rank names & pictures",addE:"➕ Add Electronics component",addM:"➕ Add Mechanical component",compE:"📚 Electronics components",compM:"📚 Mechanical components",quizE:"❓ Electronics quiz",quizM:"❓ Mechanical quiz",arena:"⚔️ Battle arena"}[t];body=`<button onclick="openTeacher()">← Teacher</button><h2 style="margin:8px 0">${title}</h2>`+(t==="ranks"?ranksCard():t==="arena"?arenaCard():t.startsWith("add")?addCard(w):t.startsWith("comp")?editCard()+compCard(w):quizCard(w))}el("screen").innerHTML=nav()+body}
function fileData(file){return new Promise(resolve=>{if(!file)return resolve("");const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}
async function readPage(){const g={what:el("what").value.trim(),does:el("does").value.trim(),image:"",video:"",imageId:await putFile(el("image").files[0]),videoId:await putFile(el("video").files[0])};return g}
function hasImg(g){return !!(g.nImg||(!g.dImg&&(g.imageId||g.image)))}
function hasVid(g){return !!(g.nVid||(!g.dVid&&(g.videoId||g.video)))}
function editComponent(w,c,i){const x=comps(w)[c][i];pagesOf(x);ed={w,c,i,name:x.name,cat:c,pages:x.pages.map(g=>({what:g.what||"",does:g.does||"",imageId:g.imageId||"",videoId:g.videoId||"",image:g.image||"",video:g.video||"",nImg:null,nVid:null,dImg:false,dVid:false}))};teacher();setTimeout(()=>{const e=el("edcard");if(e)e.scrollIntoView({behavior:"smooth",block:"start"})},60)}
function edRefresh(){const y=window.scrollY;teacher();window.scrollTo(0,y)}
function edDel(pi,k){const g=ed.pages[pi];if(k==="i"){g.dImg=true;g.nImg=null}else{g.dVid=true;g.nVid=null}edRefresh()}
function edAddPage(){ed.pages.push({what:"",does:"",imageId:"",videoId:"",image:"",video:"",nImg:null,nVid:null,dImg:false,dVid:false});edRefresh()}
function edDelPage(pi){if(!confirm("Delete this page?"))return;ed.pages.splice(pi,1);edRefresh()}
function edCancel(){ed=null;teacher()}
function editCard(){if(!ed)return"";const W=WORLD[ed.w];return `<div class="card" id="edcard" style="border:2px solid #f97316"><h3>✏️ Editing component</h3><input value="${esc(ed.name)}" oninput="ed.name=this.value" placeholder="Component name"><select onchange="ed.cat=this.value">${W.cats.map(c=>`<option${c===ed.cat?" selected":""}>${esc(c)}</option>`).join("")}</select>${ed.pages.map((g,pi)=>`<div class="card" style="background:#f8fafc"><b>Page ${pi+1}</b><textarea oninput="ed.pages[${pi}].what=this.value" placeholder="What is it?">${esc(g.what)}</textarea><textarea oninput="ed.pages[${pi}].does=this.value" placeholder="What does it do?">${esc(g.does)}</textarea><p class="muted" style="margin:6px 0">📷 ${g.nImg?"New picture ready":hasImg(g)?"Picture added":"No picture"} · 🎬 ${g.nVid?"New video ready":hasVid(g)?"Video added":"No video"}</p><label>${hasImg(g)?"Replace":"Add"} picture<input type="file" accept="image/*" onchange="ed.pages[${pi}].nImg=this.files[0]||null;ed.pages[${pi}].dImg=false;edRefresh()"></label>${hasImg(g)?`<button onclick="edDel(${pi},'i')">Remove picture</button>`:""}<label>${hasVid(g)?"Replace":"Add"} video<input type="file" accept="video/*" onchange="ed.pages[${pi}].nVid=this.files[0]||null;ed.pages[${pi}].dVid=false;edRefresh()"></label>${hasVid(g)?`<button onclick="edDel(${pi},'v')">Remove video</button>`:""}${ed.pages.length>1?`<button onclick="edDelPage(${pi})">🗑️ Delete this page</button>`:""}</div>`).join("")}<button onclick="edAddPage()">➕ Add page</button><button class="primary" onclick="edSave()">Save changes</button><button onclick="edCancel()">Cancel</button></div>`}
async function edSave(){const name=ed.name.trim();if(!name)return alert("Enter a component name.");const x=comps(ed.w)[ed.c][ed.i],pages=[];for(const g of ed.pages){const o={what:g.what.trim(),does:g.does.trim(),image:g.image,video:g.video,imageId:g.imageId,videoId:g.videoId};if(g.nImg){await delFile(o.imageId);o.imageId=await putFile(g.nImg);o.image=""}else if(g.dImg){await delFile(o.imageId);o.imageId="";o.image=""}if(g.nVid){await delFile(o.videoId);o.videoId=await putFile(g.nVid);o.video=""}else if(g.dVid){await delFile(o.videoId);o.videoId="";o.video=""}pages.push(o)}x.name=name;x.pages=pages;if(ed.cat!==ed.c){comps(ed.w)[ed.c].splice(ed.i,1);comps(ed.w)[ed.cat].push(x)}save();ed=null;teacher()}
function pageHasContent(g){return g.what||g.does||g.imageId||g.videoId}
async function nextPage(){draft.name=el("name").value.trim();draft.cat=el("cat").value;const g=await readPage();if(!pageHasContent(g))return alert("Add some text, a picture or a video to this page first.");draft.pages.push(g);teacher()}
async function addComponent(){const name=el("name").value.trim();if(!name)return alert("Enter a component name.");const c=el("cat").value,w=draft.w;const g=await readPage();if(pageHasContent(g))draft.pages.push(g);if(!draft.pages.length)return alert("Add at least one page first.");comps(w)[c].push({name,done:false,pages:draft.pages});draft={w,name:"",cat:c,pages:[]};save();teacher()}
async function clearDraft(){if(!confirm("Throw away the pages you have not saved?"))return;for(const g of draft.pages){await delFile(g.imageId);await delFile(g.videoId)}draft={w:draft.w,name:"",cat:draft.cat,pages:[]};teacher()}
function toggleDone(c,i,w){const x=comps(w)[c][i];x.done=!x.done;save();teacher()}
async function delFile(id){if(!id)return;try{const db=await openDB();db.transaction("files","readwrite").objectStore("files").delete(id)}catch(e){}}
async function removeComponent(c,i,w){const x=comps(w)[c][i];if(!confirm(`Delete "${x.name}"?`))return;for(const g of pagesOf(x)){await delFile(g.imageId);await delFile(g.videoId)}comps(w)[c].splice(i,1);ed=null;save();teacher()}
function addQuiz(){const q=el("qq").value.trim(),a=[0,1,2,3].map(i=>el("qa"+i).value.trim());if(!q||a.some(x=>!x))return alert("Enter the question and all four answers.");state[WORLD[addQW].qk].push({q,a,correct:+el("qc").value});save();teacher()}

let tLevel=0;

function setRankImg(r,inp){const f=inp.files&&inp.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d");const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);readRanks();state.rankImgs[tLevel][r]=c.toDataURL("image/jpeg",.82);save();teacher()};im.onerror=()=>alert("That picture could not be opened.");im.src=fr.result};fr.readAsDataURL(f)}

if(light)return;const o=P.find(q=>q.id===sim.sel);let pp="";if(o){const ti=o.t==="frame"?SNAME[o.shape]:o.t==="gear"?o.teeth+" teeth gear":o.t==="motor"?"Motor":o.t==="wheel"?SZN[o.size]+" wheel":o.t==="pulley"?SZN[o.size]+" pulley":o.t==="rack"?"Rack "+o.len:o.cross?"Crossed belt":"Open belt";pp=`<div class="card"><h3>${ti}</h3>`;if(o.t==="motor")pp+=`<label>Speed (RPM)<input type="number" min="1" max="300" value="${o.rpm}" oninput="mSet('rpm',this.value)"></label><label>Direction<select onchange="mSet('dir',this.value)"><option value="1"${o.dir>0?" selected":""}>↻ Clockwise</option><option value="-1"${o.dir<0?" selected":""}>↺ Anticlockwise</option></select></label>`;if(o.t==="gear")pp+=`<p class="muted">Gears only touch other gears on the same layer. Two gears on one hole sit on different layers.</p><button onclick="mLayer()">Layer: ${(o.z||0)?"Back":"Front"} (tap to switch)</button>`;if(o.t==="rack")pp+=`<p class="muted">Put a gear beside the rack. The distance from the gear's centre to the rack line must equal the gear's radius.</p>`;if(o.t==="belt")pp+=`<p class="muted">The belt links two pulleys. A crossed belt flips the direction.</p>`;if(!sim.run){if(o.t==="frame"||o.t==="rack")pp+=`<button onclick="mRot()">↻ Rotate</button>`;if(o.t!=="belt"&&o.t!=="rack")pp+=`<button onclick="mDisc()">✂️ Disconnect</button>`;pp+=`<button onclick="mDel()">🗑️ Delete</button>`}pp+=`</div>`}el("spanel").innerHTML=pp}
function simViewM(){el("screen").innerHTML=`<div class="simtop"><button onclick="closeProject()">← Projects</button><button onclick="delThisProject()">🗑️ Delete project</button></div><h3 style="margin:8px 0 2px">${esc(sim.p.name)}</h3><div class="simhead"><div class="shopwrap"><button id="runbtn" class="primary" onclick="simRun()"></button><button onclick="openShop()">🛒 Shop</button><button id="mtog" onclick="toggleTog()"></button></div></div><p id="shint" class="muted" style="margin:6px 0"></p><svg id="sv" viewBox="0 0 380 470"></svg><div class="simbar"><button onclick="simUndo()">↩ Undo</button><button onclick="mClear()">Clear all</button></div><div id="sres"></div><div id="spanel"></div>`;const s=el("sv");s.addEventListener("pointerdown",mDown);s.addEventListener("pointermove",mMove);s.addEventListener("pointerup",mUp);s.addEventListener("pointercancel",mUp);drawM()}
/* ===== MECHANICAL BATTLE + AUTO SNAP ===== */
const TSTALL=6,MAXRPM=300,EFF=0.95,CMU=0.8/12;
function holeSet(){const H=new Set();sim.p.parts.filter(o=>o.t==="frame").forEach(o=>holesOf(o).forEach(h=>H.add(hk(h))));return H}
function autoSnap(o){const H=holeSet(),P=sim.p.parts;
if(o.t==="rack"){let best=null;P.filter(g=>g.t==="gear").forEach(g=>{const rad=rr(g)/LP,hz=!o.rot;let ideal,pos,lo,hi;if(hz){ideal=g.j+(o.j>=g.j?rad:-rad);const dd=Math.abs(o.j-ideal);if(dd>2.5)return;pos=g.i;lo=o.i-1.5;hi=o.i+o.len-1+1.5;if(pos<lo||pos>hi)return;best=!best||dd<best.dd?{dd,j:ideal,i:Math.max(o.i-0,pos<o.i?pos:pos>o.i+o.len-1?pos-(o.len-1):o.i)}:best}else{ideal=g.i+(o.i>=g.i?rad:-rad);const dd=Math.abs(o.i-ideal);if(dd>2.5)return;pos=g.j;lo=o.j-1.5;hi=o.j+o.len-1+1.5;if(pos<lo||pos>hi)return;best=!best||dd<best.dd?{dd,i:ideal,j:pos<o.j?pos:pos>o.j+o.len-1?pos-(o.len-1):o.j}:best}});if(best){if(!o.rot){o.j=best.j;o.i=best.i}else{o.i=best.i;o.j=best.j}}return}
if(["gear","motor","wheel","pulley"].includes(o.t)){let best=null;if(o.t==="gear"){P.filter(b=>b.t==="gear"&&b.id!==o.id&&(b.z||0)===(o.z||0)).forEach(b=>{const s=(o.teeth+b.teeth)/8;for(let di=-s;di<=s;di++){const dj2=s*s-di*di,dj=Math.round(Math.sqrt(dj2));if(dj*dj!==dj2)continue;[dj,-dj].forEach(q=>{const ci=b.i+di,cj=b.j+q,d=Math.hypot(ci-o.i,cj-o.j),sc=d-(H.has(ci+","+cj)?1.5:0);if(d<=3.4&&(!best||sc<best.sc))best={ci,cj,sc}})}})}
if(!best){H.forEach(k=>{const[ci,cj]=k.split(",").map(Number),d=Math.hypot(ci-o.i,cj-o.j);if(d<=1.7&&(!best||d<best.sc))best={ci,cj,sc:d}})}if(best){o.i=best.ci;o.j=best.cj}}}
function evalBattle(proj,ar){const keep=sim;let res,simp;sim={p:JSON.parse(JSON.stringify(proj)),hist:[],run:true};try{solveMech();res=sim.mres;simp=sim.p}finally{sim=keep}
const Freq=ar.mass*9.8*ar.fric,o={win:false,fail:"",msg:"",Freq,cm:null,simp,res};
const mr=res.rows.find(r=>r.g.t==="motor"&&r.driven&&r.w);
if(res.jam){o.fail="jam";o.msg="Your machine jams, so nothing moves.";return o}
if(!mr){o.fail="nomotor";o.msg="Your machine has no motor mounted on a frame hole, so nothing turns.";return o}
const racks=Object.entries(res.racks).filter(([id,k])=>k.v&&k.g);
if(!racks.length){o.fail="norack";o.msg="No rack is being pushed by a gear. Put a gear beside a rack at the right distance.";return o}
let best=null;racks.forEach(([id,k])=>{const pr=res.rows.find(r=>r.g.id===k.g);if(!pr||!pr.w)return;const rad=rr(pr.g)*CMU,Tm=Math.max(0,TSTALL*(1-mr.g.rpm/MAXRPM)),ratio=Math.abs(mr.w)/Math.abs(pr.w),eff=Math.pow(EFF,Math.max(1,pr.depth)),F=Tm*ratio*eff/rad,v=Math.abs(k.rl)*0.8,travel=(k.v>0?k.hi:-k.lo)*CMU,tN=v>0?ar.dist/v:1e9;const c={Tm,ratio,eff,F,v,travel,tN,rid:id,k,rpmP:Math.abs(pr.w),rpmM:mr.g.rpm,fOK:F>=Freq,tOK:tN<=ar.time,dOK:travel>=ar.dist};c.score=(c.fOK?1:0)+(c.tOK?1:0)+(c.dOK?1:0);if(!best||c.score>best.score)best=c});
if(!best){o.fail="norack";o.msg="The rack is not being pushed. Check that the gear touching it is driven by the motor.";return o}
o.cm=best;o.win=best.fOK&&best.tOK&&best.dOK;return o}
function mbattle(){const A=state.arenas;el("screen").innerHTML=nav()+`<button onclick="mechanical()">← Mechanical World</button><div class="bhero"><div class="bt"><span class="pill">GAME MODE</span><h1>MECHANICAL<br><em>BATTLE</em></h1><p>Build. Test. Win!</p></div><img src="${BT.banner}" alt=""></div><h3 class="arh">⚙️ ARENAS <small>Choose your challenge</small></h3>`+A.map((a,i)=>`<div class="arena"><img src="${BT.box}" alt=""><div><span class="pill easy">🎮 EASY</span><h3>${esc(a.name)}</h3><p>${esc(a.story)}</p><div class="stats3"><span><b>${a.mass} kg</b>Weight</span><span><b>${a.dist} cm</b>Distance</span><span><b>${a.time} s</b>Time limit</span></div></div><button class="go" onclick="arenaScreen(${i})">🛠️ ENTER ARENA</button></div>`).join("")+`<p style="text-align:center">⚔️ Battles won: <b>${state.stats.wins||0}</b></p>`;el("screen").classList.add("dk")}
function arenaScreen(i){const a=state.arenas[i],P=state.projects.map((p,k)=>[p,k]).filter(([p])=>p.type==="m");el("screen").innerHTML=nav()+`<button onclick="mbattle()">← Arenas</button><div class="arena one"><img src="${BT.box}" alt=""><div><h3>${esc(a.name)}</h3><p>${esc(a.story)}</p><p><b>Mission:</b> move the ${a.mass} kg box from A to B (${a.dist} cm) in ${a.time} seconds.</p></div></div><div class="card"><h3>Choose your machine</h3>${P.length?P.map(([p,k])=>`<div class="crow"><span>⚙️ ${esc(p.name)} <small class="muted">(${p.parts.length} parts)</small></span><button class="primary" onclick="fight(${i},${k})">⚔️ Fight!</button></div>`).join(""):'<p class="muted">You have no mechanical projects yet. Build one in Mechanical World → Simulation.</p>'}</div>`;el("screen").classList.add("dk")}
function fight(ai,pk){const a=state.arenas[ai],p=state.projects[pk],r=evalBattle(p,a),c=r.cm;el("screen").innerHTML=nav()+`<div class="fhead"><button onclick="arenaScreen(${ai})">← Back</button><b>🛠️ ${esc(p.name)}</b></div><div class="hud"><div><span>💪 Power</span><div class="meter"><i id="mpow"></i></div><small id="mpowt"></small></div><div><span>⏱️ Time</span><div class="meter"><i id="mtim"></i></div><small id="mtimt"></small></div><div><span>⚡ Speed</span><b id="mspd">—</b></div></div><div class="stagewrap"><svg id="sv" class="bsv"></svg><div id="bcount" class="cd"></div></div><button id="runbtn" style="display:none"></button><div id="sres" style="display:none"></div><div id="btimer" class="muted" style="margin:6px 0;text-align:center"></div><div id="bres"></div>`;el("screen").classList.add("dk");if(c){const pw=Math.min(1,c.F/Math.max(0.01,r.Freq));el("mpow").style.width=(pw*100)+"%";el("mpow").style.background=c.fOK?"#7ed321":"#ef4444";el("mpowt").textContent=`${(+c.F.toFixed(1))} N of ${(+r.Freq.toFixed(1))} N needed`;el("mspd").textContent=(+c.v.toFixed(1))+" cm/s";el("mtimt").textContent="limit "+a.time+" s"}else{el("mpowt").textContent="no machine power";el("mtimt").textContent="limit "+a.time+" s"}
const P=r.simp,B={a,r,ai,pk,done:false,ts:1,tend:1.8,u:1,F0:null};
if(c&&c.k){const rk=P.parts.find(o=>o.id===c.rid),hz=!rk.rot,sg=c.k.v>0?1:-1,L=(rk.len-1)*LP,k=c.k;B.rk=rk;B.hz=hz;B.sg=sg;B.F0=hz?[sg>0?rk.i*LP+L+6:rk.i*LP-6,rk.j*LP]:[rk.i*LP,sg>0?rk.j*LP+L+6:rk.j*LP-6];B.start=[B.F0[0]+(hz?sg*17:0),B.F0[1]+(hz?0:sg*17)];B.du=a.dist/CMU;B.v=Math.abs(k.v);B.trav=sg>0?k.hi:-k.lo;
if(c.fOK){B.tend=Math.min(B.du/B.v,a.time/SPD,B.trav/B.v);B.tend=Math.max(0.5,B.tend)}else{Object.values(r.res.rot).forEach(x=>{x.w=0})}B.ts=Math.max(1,B.tend/6)}else if(r.res)Object.values(r.res.rot).forEach(x=>{x.w=0});
bat=B;const sv=el("sv");let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const ex=(x,y,m)=>{x0=Math.min(x0,x-m);y0=Math.min(y0,y-m);x1=Math.max(x1,x+m);y1=Math.max(y1,y+m)};
P.parts.forEach(o=>{if(o.t==="belt")return;if(o.t==="frame")holesOf(o).forEach(h=>ex(h[0]*LP,h[1]*LP,12));else if(o.t==="rack"){const L=(o.len-1)*LP;if(o.rot){ex(o.i*LP,o.j*LP,14);ex(o.i*LP,o.j*LP+L,14)}else{ex(o.i*LP,o.j*LP,14);ex(o.i*LP+L,o.j*LP,14)}}else ex(o.i*LP,o.j*LP,o.t==="motor"?26:rr(o)+8)});
if(B.start){const sg=B.sg,T=B.du+Math.max(0,B.trav);[0,1].forEach(q=>{const d=q?B.du:0;ex(B.start[0]+(B.hz?sg*d:0),B.start[1]+(B.hz?0:sg*d),30)});if(B.hz)ex(B.start[0]+sg*B.trav,B.start[1],30);else ex(B.start[0],B.start[1]+sg*B.trav,30)}
const pad=14;x0-=pad;y0-=pad;x1+=pad;y1+=pad;let w=Math.max(220,x1-x0),h=Math.max(140,y1-y0);x0-=(w-(x1-x0))/2;y0-=(h-(y1-y0))/2;sv.setAttribute("viewBox",`${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}`);
sim={p:P,run:true,mres:r.res,sel:null,tog:false,t0:performance.now(),hist:[],drag:null};drawM(true);bOverlay(0);el("btimer").textContent="Get ready!";const cd=el("bcount");let n=3;const tick=()=>{if(bat!==B||!el("bcount"))return;if(n>0){cd.textContent=n;cd.className="cd pop";n--;setTimeout(tick,900)}else{cd.textContent="GO!";cd.className="cd pop go";setTimeout(()=>{if(bat!==B||!el("bcount"))return;cd.textContent="";cd.className="cd";B.wall=performance.now();requestAnimationFrame(bLoop)},600)}};tick()}


function bOverlay(tm){const B=bat,a=B.a,c=B.r.cm;if(!B.start)return;const sv=el("sv"),sg=B.sg,hz=B.hz;let s=0;if(c.fOK){const k=c.k;s=Math.max(k.lo,Math.min(k.hi,k.v*tm))}const bx=B.start[0]+(hz?s:0),by=B.start[1]+(hz?0:s),fl=(x,y,col,txt)=>`<line x1="${x}" y1="${y-34}" x2="${x}" y2="${y+14}" stroke="#cbd5e1" stroke-width="3"/><path d="M${x} ${y-34} l22 8 l-22 8z" fill="${col}"/><text x="${x-4}" y="${y+28}" font-size="13" font-weight="700" fill="#eaf2ff">${txt}</text>`,ax=B.start[0]-(hz?sg*24:0),ay=B.start[1]-(hz?0:sg*24),bxF=B.start[0]+(hz?sg*(B.du+24):0),byF=B.start[1]+(hz?0:sg*(B.du+24));sv.insertAdjacentHTML("beforeend",fl(ax,ay,"#2563eb","A")+fl(bxF,byF,"#16a34a","B")+`<g><rect x="${bx-17}" y="${by-17}" width="34" height="34" rx="4" fill="#d6a56b" stroke="#7c4a1e" stroke-width="2"/><line x1="${bx-17}" y1="${by-6}" x2="${bx+17}" y2="${by-6}" stroke="#7c4a1e"/><text x="${bx}" y="${by+10}" font-size="10" text-anchor="middle" font-weight="700" fill="#4a2c0f">${a.mass} kg</text></g>`);B.cur=s}
function bLoop(){if(!bat||bat.done||!el("btimer"))return;const B=bat,a=B.a,r=B.r,c=r.cm;let tm=(performance.now()-B.wall)/1000*B.ts;const end=tm>=B.tend;if(end)tm=B.tend;sim.t0=performance.now()-tm*1000;if(sim.mres&&c&&!c.fOK)tm=tm;drawM(true);bOverlay(tm);el("btimer").textContent=c?`⏱️ ${Math.min(tm*SPD,a.time).toFixed(1)} s of ${a.time} s`:"";if(el("mtim"))el("mtim").style.width=Math.min(100,tm*SPD/a.time*100)+"%";if(end){B.done=true;bResult();return}requestAnimationFrame(bLoop)}
function bResult(){const a=bat.a,r=bat.r,c=r.cm,ok=r.win,F=n=>(+n.toFixed(1)).toString(),tick=b=>b?"✅":"❌";let lines="",hint="";if(!c){hint=r.msg}else{lines=`<div class="smsg info">🔧 Motor: ${c.rpmM} RPM → torque ${F(c.Tm)} N·cm</div><div class="smsg info">⚙️ Pinion turns at ${F(c.rpmP)} RPM (gears change the speed by ×${F(1/c.ratio)} and the strength by ×${F(c.ratio)})</div><div class="smsg ${c.fOK?"good":"bad"}">${tick(c.fOK)} Force on the box: ${F(c.F)} N (needs ${F(r.Freq)} N)</div><div class="smsg ${c.tOK?"good":"bad"}">${tick(c.tOK)} Speed: ${F(c.v)} cm/s → ${c.tN<1e8?F(c.tN)+" s":"too slow"} for ${a.dist} cm (limit ${a.time} s)</div><div class="smsg ${c.dOK?"good":"bad"}">${tick(c.dOK)} The rack can push ${F(c.travel)} cm (needs ${a.dist} cm)</div>`;if(!c.fOK)hint="Not enough force. Use a small gear driving a big gear to get more strength, use a smaller pinion gear, or lower the motor speed (a slower motor is stronger).";else if(!c.tOK)hint="Too slow. Use less gear reduction, a bigger pinion gear, or a faster motor.";else if(!c.dOK)hint="The rack is too short. Use a longer rack and start with the gear at its far end."}
if(ok){state.stats.wins=(state.stats.wins||0)+1;save()}el("bres").innerHTML=`<div class="rescard ${ok?"win":"lose"}"><img src="${ok?BT.win:BT.lose}" alt=""><div><h2>${ok?"🏆 VICTORY!":"💥 DEFEATED"}</h2><p>${ok?`Your machine moved the ${a.mass} kg box to B!`:esc(r.msg||"The box did not reach B.")}</p></div></div>${lines}${ok?"":`<div class="smsg warn">💡 ${hint}</div>`}<p style="text-align:center">⚔️ Battles won: <b>${state.stats.wins||0}</b></p><div class="two"><button class="primary" onclick="fight(${bat.ai},${bat.pk})">⚔️ Fight again</button><button onclick="arenaScreen(${bat.ai})">Choose another machine</button></div>`}
function arenaCard(){const a=state.arenas[0];return `<div class="card"><h3>⚔️ Mechanical battle arena</h3><label>Arena name<input type="text" value="${esc(a.name)}" oninput="state.arenas[0].name=this.value"></label><label>Story<textarea oninput="state.arenas[0].story=this.value">${esc(a.story)}</textarea></label><label>Box weight (kg)<input type="number" step="0.5" min="0.5" value="${a.mass}" oninput="state.arenas[0].mass=Math.max(0.1,+this.value||0.1)"></label><label>Distance from A to B (cm)<input type="number" step="0.5" min="1" value="${a.dist}" oninput="state.arenas[0].dist=Math.max(0.5,+this.value||0.5)"></label><label>Time limit (seconds)<input type="number" step="1" min="1" value="${a.time}" oninput="state.arenas[0].time=Math.max(1,+this.value||1)"></label><label>Floor roughness (0.1 smooth, 0.6 rough)<input type="number" step="0.05" min="0.05" max="1" value="${a.fric}" oninput="state.arenas[0].fric=Math.max(0.05,+this.value||0.05)"></label><button class="primary" onclick="save();alert('Arena saved!')">Save arena</button></div>`}
