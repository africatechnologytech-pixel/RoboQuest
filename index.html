<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RoboQuest</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17324d">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#17324d;--accent:#f59e0b;--accentbg:#fff3d6;--border:#dbe4ee;--muted:#64748b;--bg:#f4f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}
.app{max-width:760px;margin:auto;min-height:100vh;background:white}
header{background:var(--navy);color:#fff;padding:20px}
main{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--border);border-radius:18px;padding:18px;margin:12px 0;background:#fff}
button{min-height:46px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--navy);font-weight:700;padding:10px 14px;margin:4px;cursor:pointer}
.primary{background:var(--accentbg);border-color:var(--accent)}.muted{color:var(--muted)}
.stars{display:flex;flex-wrap:wrap}.star{font-size:25px;border:0;background:transparent}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;margin:6px 0 12px;font-size:16px}
img,video{max-width:100%;border-radius:12px;margin-top:10px}
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .5s}#splash video{width:100%;height:100%;object-fit:contain;margin:0;border-radius:0}#splash.hide{opacity:0;pointer-events:none}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="splash" onclick="hideSplash()"><video id="splashvid" src="776932576_1791062217115790.mp4" autoplay muted playsinline></video></div>
<div class="app">
<header><h1>🤖 RoboQuest</h1><div id="greeting"></div></header>
<main id="screen"></main>
</div>
<script>
const KEY="roboquest_v1";
const defaults={
 child:"Inventor",
 stars:Array.from({length:5},()=>Array.from({length:4},()=>[false,false,false,false,false])),
 stats:{answered:0,correct:0},
 levelNames:["Level 1","Level 2","Level 3","Level 4","Level 5"],
 components:{
  Power:[{name:"Battery",what:"A battery is a source of electrical energy.",does:"It supplies electrical power to a circuit.",image:"",video:""}],
  Input:[{name:"Push Button",what:"A push button is an input component operated by pressing it.",does:"It lets a user send an ON/OFF signal to a circuit or controller.",image:"",video:""}],
  Control:[{name:"Arduino",what:"Arduino is a programmable electronics platform.",does:"It can read inputs and control outputs.",image:"",video:""}],
  Output:[{name:"Motor",what:"A motor converts electrical energy into mechanical motion.",does:"It produces rotational movement.",image:"",video:""}],
  Support:[{name:"Resistor",what:"A resistor is an electronic component that resists current.",does:"It helps control current in a circuit.",image:"",video:""}]
 },
 quizzes:[{q:"Which one is an electronic component?",a:["Gear","Battery","Wheel","Lever"],correct:1}]
};
let state=load();
const ranks=["Robo Rookie","Robo Junior Inventor","Robo Builder","Robo Master"];
const cats=["Power","Input","Control","Output","Support"];
const icons={Power:"🔋",Input:"🔘",Control:"🧠",Output:"⚙️",Support:"〰️"};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(!x)return clone(defaults);const s=Object.assign(clone(defaults),x);if(!Array.isArray(s.stars[0][0]))s.stars=[s.stars].concat(clone(defaults.stars).slice(1));if(!s.stats)s.stats={answered:0,correct:0};return s}catch(e){return clone(defaults)}}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function lname(l){return (state.levelNames&&state.levelNames[l]&&state.levelNames[l].trim())||`Level ${l+1}`}
function levelDone(l){return state.stars[l].flat().every(Boolean)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert("Could not save. Storage may be full.")}}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("roboquest_media",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function putFile(file){if(!file)return"";const db=await openDB();const id="f"+Date.now()+Math.random().toString(36).slice(2);await new Promise((res,rej)=>{const t=db.transaction("files","readwrite");t.objectStore("files").put(file,id);t.oncomplete=res;t.onerror=()=>rej(t.error)});return id}
async function fileUrl(id){if(!id)return"";try{const db=await openDB();return await new Promise(res=>{const q=db.transaction("files").objectStore("files").get(id);q.onsuccess=()=>res(q.result?URL.createObjectURL(q.result):"");q.onerror=()=>res("")})}catch(e){return""}}
function el(s){return document.getElementById(s)}
function nav(){return `<button onclick="home()">← Home</button>`}
function home(){const stars=state.stars.flat(2).filter(Boolean).length;let lvl=1;while(lvl<5&&levelDone(lvl-1))lvl++;const facts=cats.reduce((n,c)=>n+state.components[c].length,0);el("greeting").textContent=`Welcome, ${state.child}!`;el("screen").innerHTML=`<h2>🏠 Home</h2><div class="card"><h3>Inventor name</h3><input id="childname" value="${esc(state.child)}" placeholder="Inventor name"><button class="primary" onclick="saveName()">Save name</button></div><div class="grid"><div class="card"><h3>⭐ ${stars}/100</h3><span class="muted">RoboStars earned</span></div><div class="card"><h3>🏆 ${esc(lname(lvl-1))}</h3><span class="muted">Current level</span></div><div class="card"><h3>💡 ${facts}</h3><span class="muted">Facts learned</span></div><div class="card"><h3>❓ ${state.quizzes.length}</h3><span class="muted">Quiz questions</span></div><div class="card"><h3>✅ ${state.stats.correct}/${state.stats.answered}</h3><span class="muted">Quiz answers correct</span></div></div><div class="grid"><button class="primary" onclick="progress()">🏆 Progress</button><button class="primary" onclick="electronics()">⚡ Electronics</button><button onclick="about()">📖 About</button><button onclick="mechanical()">⚙️ Mechanical World</button></div><div class="card"><button onclick="teacher()">⚙️ Teacher Control</button></div>`}
function saveName(){state.child=el("childname").value.trim()||"Inventor";save();home()}
function progress(){let h=nav()+`<h2>🏆 Progress</h2><p class="muted">Complete all 20 RoboStars in a level to unlock the next level.</p>`;for(let l=0;l<5;l++){const unlocked=l===0||levelDone(l-1);h+=`<div class="card"><h3>${esc(lname(l))} ${unlocked?"🔓":"🔒"}</h3>`;if(unlocked){ranks.forEach((r,ri)=>{h+=`<b>${r}</b><div class="stars">`;state.stars[l][ri].forEach((on,si)=>h+=`<button class="star" onclick="award(${l},${ri},${si})">${on?"⭐":"☆"}</button>`);h+=`</div>`});h+=`<p class="muted">${state.stars[l].flat().filter(Boolean).length}/20 RoboStars</p>`}else h+=`<p class="muted">Locked — complete the previous level.</p>`;h+=`</div>`}el("screen").innerHTML=h}
function award(l,r,s){const row=state.stars[l][r];if(row[s]){const later=row.slice(s+1).filter(Boolean).length;if(later&&!confirm(`Remove this star and the ${later} star(s) after it?`))return;for(let k=s;k<row.length;k++)row[k]=false;save();progress();return}if(row.slice(0,s).every(Boolean)){row[s]=true;save();progress();if(levelDone(l)){alert(l<4?`${lname(l)} complete! ${lname(l+1)} is unlocked.`:"All levels complete! Amazing!")}return}progress()}
function electronics(){el("screen").innerHTML=nav()+`<h2>⚡ Electronics</h2><p class="muted">Choose a category.</p><div class="grid">${cats.map(c=>`<button onclick="category('${c}')">${icons[c]} ${c}</button>`).join("")}</div><div class="card"><button onclick="quiz()">❓ Quiz</button><button onclick="simulation()">🔌 Simulation</button><button onclick="battle()">⚔️ Battle Mode</button></div>`}
function category(c){el("screen").innerHTML=nav()+`<button onclick="electronics()">← Electronics</button><h2>${icons[c]} ${c}</h2><div class="grid">${state.components[c].map((x,i)=>`<button onclick="component('${c}',${i})">${x.name}</button>`).join("")}</div>`}
function component(c,i){const x=state.components[c][i];el("screen").innerHTML=nav()+`<button onclick="category('${c}')">← ${c}</button><div class="card"><h2>${x.name}</h2><h3>What is it?</h3><p>${x.what||"No description added yet."}</p><h3>What does it do?</h3><p>${x.does||"No function description added yet."}</p>${(x.image||x.imageId)?`<img id="mimg" src="${x.image||""}" alt="${x.name}">`:""}${(x.video||x.videoId)?`<video id="mvid" controls src="${x.video||""}"></video>`:""}</div>`;if(x.imageId)fileUrl(x.imageId).then(u=>{if(u&&el("mimg"))el("mimg").src=u});if(x.videoId)fileUrl(x.videoId).then(u=>{if(u&&el("mvid"))el("mvid").src=u})}
function mechanical(){el("screen").innerHTML=nav()+`<div class="card"><h2>⚙️ Mechanical World</h2><h3>Coming Soon!</h3><p class="muted">The Mechanical World will be added in a future version.</p></div>`}
function about(){el("screen").innerHTML=nav()+`<div class="card"><h2>📖 About RoboQuest</h2><p>RoboQuest is an interactive robotics learning journey for young inventors.</p></div>`}
function teacher(){el("screen").innerHTML=nav()+`<h2>⚙️ Teacher Control</h2><div class="card"><h3>Level Names</h3>${[0,1,2,3,4].map(i=>`<input id="ln${i}" value="${esc(lname(i))}" placeholder="Level ${i+1} name">`).join("")}<button class="primary" onclick="saveLevelNames()">Save level names</button></div><div class="card"><h3>Add Component</h3><select id="cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select><input id="name" placeholder="Component name"><textarea id="what" placeholder="What is it?"></textarea><textarea id="does" placeholder="What does it do?"></textarea><label>Picture<input id="image" type="file" accept="image/*"></label><label>Video<input id="video" type="file" accept="video/*"></label><button class="primary" onclick="addComponent()">Add Component</button></div><div class="card"><h3>Quiz Manager</h3><p>${state.quizzes.length} quiz question(s)</p>${state.quizzes.map((q,qi)=>`<p>${qi+1}. ${esc(q.q)} <button onclick="removeQuiz(${qi})">🗑️</button></p>`).join("")}<h3>Add Quiz Question</h3><input id="qq" placeholder="Question"><input id="qa0" placeholder="Answer A"><input id="qa1" placeholder="Answer B"><input id="qa2" placeholder="Answer C"><input id="qa3" placeholder="Answer D"><select id="qc"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><button class="primary" onclick="addQuiz()">➕ Add Quiz</button></div><div class="card"><h3>Components</h3>${cats.map(c=>`<p><b>${icons[c]} ${c}</b></p>${state.components[c].map((x,i)=>`<p>${esc(x.name)} <button onclick="removeComponent('${c}',${i})">🗑️</button></p>`).join("")||`<p class="muted">None</p>`}`).join("")}</div>`}
function fileData(file){return new Promise(resolve=>{if(!file)return resolve("");const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}
async function addComponent(){const name=el("name").value.trim();if(!name)return alert("Enter a component name.");const c=el("cat").value;state.components[c].push({name,what:el("what").value.trim(),does:el("does").value.trim(),image:"",video:"",imageId:await putFile(el("image").files[0]),videoId:await putFile(el("video").files[0])});save();teacher()}
async function delFile(id){if(!id)return;try{const db=await openDB();db.transaction("files","readwrite").objectStore("files").delete(id)}catch(e){}}
async function removeComponent(c,i){const x=state.components[c][i];if(!confirm(`Delete "${x.name}"?`))return;await delFile(x.imageId);await delFile(x.videoId);state.components[c].splice(i,1);save();teacher()}
function addQuiz(){const q=el("qq").value.trim(),a=[0,1,2,3].map(i=>el("qa"+i).value.trim());if(!q||a.some(x=>!x))return alert("Enter the question and all four answers.");state.quizzes.push({q,a,correct:+el("qc").value});save();teacher()}
function removeQuiz(i){if(confirm("Remove this question?")){state.quizzes.splice(i,1);save();teacher()}}
let qi=0;
function quiz(){if(!state.quizzes.length){el("screen").innerHTML=nav()+`<div class="card"><h2>❓ Quiz</h2><p>No questions yet. Ask the teacher to add some.</p></div>`;return}qi=Math.floor(Math.random()*state.quizzes.length);const q=state.quizzes[qi];el("screen").innerHTML=nav()+`<button onclick="electronics()">← Electronics</button><h2>❓ Quiz</h2><div class="card"><h3>${esc(q.q)}</h3>${q.a.map((a,i)=>`<button style="display:block;width:100%" onclick="answer(${i})">${esc(a)}</button>`).join("")}</div>`}
function answer(i){const q=state.quizzes[qi];const ok=i===q.correct;state.stats.answered++;if(ok)state.stats.correct++;save();el("screen").innerHTML=nav()+`<div class="card"><h2>${ok?"✅ Correct!":"❌ Not quite"}</h2>${ok?"":`<p>Correct answer: ${esc(q.a[q.correct])}</p>`}<button class="primary" onclick="quiz()">Next question</button></div>`}
function simulation(){el("screen").innerHTML=nav()+`<div class="card"><h2>🔌 Simulation</h2><p>Simulation is kept aside for now. We will expand it later.</p></div>`}
function battle(){el("screen").innerHTML=nav()+`<div class="card"><h2>⚔️ Battle Mode</h2><p>Battle Mode is kept aside for now. We will expand it later.</p></div>`}
home();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");

function saveLevelNames(){state.levelNames=[0,1,2,3,4].map(i=>el("ln"+i).value.trim()||`Level ${i+1}`);save();alert("Level names saved!")}
function hideSplash(){const d=el("splash");if(d&&!d.classList.contains("hide")){d.classList.add("hide");setTimeout(()=>d.remove(),600)}}
(function(){const v=el("splashvid");v.onended=hideSplash;v.onerror=hideSplash;setTimeout(hideSplash,10000);const p=v.play();if(p&&p.catch)p.catch(hideSplash)})();
</script>
</body>
</html>
